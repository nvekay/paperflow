name: Deploy n8n

# Builds the n8n image (n8n/ plus the built Paperflow node), pushes it to GitHub Container Registry and asks Render
# to deploy it. The Render step needs the RENDER_DEPLOY_HOOK_URL secret (the service's deploy hook).
on:
  push:
    branches: [main]
    paths:
      - 'n8n/**'
      - 'packages/n8n-nodes-paperflow/**'
      - 'scripts/prepare-n8n.mjs'
      - '.github/workflows/deploy-n8n.yml'
  workflow_dispatch:

concurrency:
  group: deploy-n8n
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/paperflow-n8n

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm n8n:prepare
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: n8n
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Deploy on Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; the image is pushed, deploy it from Render"
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null -X POST "$HOOK"
