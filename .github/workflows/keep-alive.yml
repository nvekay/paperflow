name: Keep the demo awake

# A free Hugging Face Space sleeps after two days without traffic, and a sleeping n8n would make the first visitor's
# invoice time out. One request a day keeps it running. Needs the N8N_URL and WEB_URL variables.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping n8n and the app
    if: vars.N8N_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: n8n health
        # A sleeping Space takes a minute or two to start
        run: curl --fail --silent --show-error --retry 10 --retry-delay 20 --retry-all-errors "${{ vars.N8N_URL }}/healthz"
      - name: Web app
        if: vars.WEB_URL != ''
        run: curl --fail --silent --show-error --output /dev/null "${{ vars.WEB_URL }}"
