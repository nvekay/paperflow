name: Keep n8n awake

# A free Render instance sleeps after 15 minutes without traffic, and a sleeping n8n makes the next visitor's invoice
# wait for it to start. A request every 10 minutes keeps it running (GitHub may run scheduled jobs a few minutes
# late). Needs the N8N_URL variable.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping n8n
    if: vars.N8N_URL != ''
    runs-on: ubuntu-latest
    steps:
      # A sleeping instance takes up to a minute to start
      - run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 "${{ vars.N8N_URL }}/healthz"
