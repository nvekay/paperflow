# Local n8n with its own Postgres database, plus the app database, for development and end-to-end tests.
# Production runs the same n8n image on Hugging Face Spaces with Neon instead of this Postgres.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperflow
      POSTGRES_PASSWORD: paperflow
      POSTGRES_DB: paperflow
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the second database for n8n on first start
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paperflow']
      interval: 2s
      timeout: 3s
      retries: 20

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.5
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '5678:5678'
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: paperflow
      DB_POSTGRESDB_PASSWORD: paperflow
      # Credentials saved in n8n are encrypted with this key; production sets its own secret
      N8N_ENCRYPTION_KEY: local-development-key-not-for-production
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      # The web app runs on the host, outside this network
      PAPERFLOW_API_URL: http://host.docker.internal:3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5678/healthz || exit 1']
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  pgdata:
