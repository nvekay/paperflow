# Local n8n with its own Postgres database, plus the app database, for development and end-to-end tests.
# Production runs the same n8n image on Hugging Face Spaces with Neon instead of this Postgres.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperflow
      POSTGRES_PASSWORD: paperflow
      POSTGRES_DB: paperflow
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the second database for n8n on first start
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paperflow']
      interval: 2s
      timeout: 3s
      retries: 20

  n8n:
    # The production image: n8n plus the Paperflow node, workflows and credentials (run `pnpm n8n:prepare` first)
    build: ./n8n
    image: paperflow-n8n
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '5678:7860'
    environment:
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: paperflow
      DB_POSTGRESDB_PASSWORD: paperflow
      # Credentials saved in n8n are encrypted with this key; production sets its own secret
      N8N_ENCRYPTION_KEY: local-development-key-not-for-production
      N8N_WEBHOOK_URL: http://localhost:5678/
      # The web app runs on the host, outside this network
      PAPERFLOW_API_URL: http://host.docker.internal:3000
      # The rest comes from .env, like on Hugging Face where these are Space secrets
      PAPERFLOW_API_KEY: ${PAPERFLOW_API_KEY}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      GOOGLE_SA_EMAIL: ${GOOGLE_SA_EMAIL:-}
      GOOGLE_SA_PRIVATE_KEY: ${GOOGLE_SA_PRIVATE_KEY:-}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:7860/healthz || exit 1']
      interval: 3s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
